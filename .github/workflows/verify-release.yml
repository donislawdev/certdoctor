# certdoctor release - the last phase: check the page a person actually sees.
#
# The build checks the tree and hands itself over, the signing script checks the
# build before touching it and confirms the draft is complete, and the
# attestation workflow checks the digest it was given against the files it
# downloads. None of them looks at the PUBLISHED release, which is the one thing
# a user sees. So this downloads what a user downloads and does what a user is
# told to do, with the commands taken from the release notes rather than
# invented here.
#
# What it does not check: the wording of the published page, which the
# maintainer may edit by hand before publishing. internal/guard holds the note
# the draft opens with to what it has to say. Nor does it start the window - a
# runner has no screen to show it on - only the command line in each archive.
#
# Read only, and that is not a detail: a verifier that can publish is not a
# verifier any more.
name: verify-release

on:
  release:
    types: [published]
  # Re-runnable by hand against any published tag, because "does that old
  # release still verify" is worth being able to ask without cutting a new one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to check, for example v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  # On a Mac, because nothing but a Mac reads a notarisation ticket, and a
  # checksum says the bytes did not move and nothing about who signed them.
  verify-macos:
    name: check the macOS downloads the way a Mac does
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: which release this is
        id: which
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "no tag to check"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checking $tag"

      - name: download the macOS archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*macos*.tar.gz'
          ls -l

      # Both archives, and in each one every program, not only the bundle: the
      # window's bundle carries the command line it starts, and a program
      # inside a bundle is signed on its own before the bundle is.
      - name: every bundle and every program in it is signed by our certificate, stapled, and starts
        shell: bash
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          # Read out of the file the signing script reads, so there is one copy
          # of the digest rather than two that can drift apart.
          pinned="$(awk '$1 == "apple-developer-id" { print $2 }' .github/signing-certificates.txt)"
          printf '%s' "$pinned" | grep -qE '^[0-9a-f]{64}$' || {
            echo "could not read the pinned Apple certificate out of .github/signing-certificates.txt"
            exit 1
          }
          echo "pinned: $pinned"

          cd "$RUNNER_TEMP/published"
          version="${TAG#v}"
          shopt -s nullglob
          found=(*macos*.tar.gz)
          shopt -u nullglob
          if [ "${#found[@]}" -ne 2 ]; then
            echo "expected two macOS archives, found ${#found[@]}"
            exit 1
          fi
          checked=0
          # The programs each bundle holds in Contents/MacOS, sorted.
          for archive in "certdoctor_${version}_macos_arm64.tar.gz:certdoctor" \
              "certdoctor-gui_${version}_macos_arm64.tar.gz:certdoctor certdoctor-gui"; do
            programs="${archive#*:}"
            archive="${archive%%:*}"
            if [ ! -f "$archive" ]; then
              echo "missing: $archive"
              exit 1
            fi
            work="unpacked_${archive%.tar.gz}"
            rm -rf "$work"
            mkdir -p "$work"
            tar -xzf "$archive" -C "$work"

            shopt -s nullglob
            apps=("$work"/*.app)
            shopt -u nullglob
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "$archive holds ${#apps[@]} bundles, and an archive holds one"
              exit 1
            fi
            app="${apps[0]}"
            held="$(find "$app/Contents/MacOS" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
            if [ "$held" != "$programs" ]; then
              echo "$archive: $(basename "$app") holds \"$held\", and should hold \"$programs\""
              exit 1
            fi

            codesign --verify --strict --deep "$app"
            # The ticket, read out of the file itself. It does not depend on
            # Gatekeeper being switched on, which is why it comes first.
            xcrun stapler validate "$app"

            for code in "$app" "$app"/Contents/MacOS/*; do
              certs="$(mktemp -d)"
              codesign -d --extract-certificates="$certs/cert" "$code" > /dev/null 2>&1
              if [ ! -f "$certs/cert0" ]; then
                echo "$archive: ${code#"$work"/} carries no certificate"
                exit 1
              fi
              actual="$(shasum -a 256 "$certs/cert0" | awk '{ print $1 }')"
              rm -rf "$certs"
              if [ "$actual" != "$pinned" ]; then
                echo "$archive: ${code#"$work"/} was signed by a DIFFERENT certificate: $actual"
                exit 1
              fi
              checked=$((checked + 1))
            done

            # What is beside the bundle has to be a link, one for each program.
            # A copy of a binary out there is refused by Gatekeeper, and ln
            # makes a copy silently where links do not work.
            for program in $programs; do
              if [ ! -L "$work/$program" ]; then
                echo "$archive does not carry a link called $program beside the bundle"
                exit 1
              fi
            done

            said="$("$work/certdoctor" --version | head -n 1)"
            if [ "$said" != "certdoctor: ${version}" ]; then
              echo "certdoctor in $archive says \"$said\", and this release is ${version}"
              exit 1
            fi
            echo "$archive: $(basename "$app") and $programs signed by the pinned certificate, stapled, and certdoctor says $said"
          done
          echo "$checked signatures read, each by the pinned certificate"

          # Gatekeeper last, and only when it is on. A runner with it disabled
          # answers "accepted" to everything, and a check that cannot fail reads
          # like proof.
          if spctl --status 2>/dev/null | grep -q "assessments enabled"; then
            for app in unpacked_*/*.app; do
              spctl -a -vv -t exec "$app"
            done
            echo "Gatekeeper accepts both bundles"
          else
            echo "NOTE: Gatekeeper assessments are off on this runner, so spctl was not asked."
            echo "The tickets and the certificates were checked above, and neither needs it."
          fi

  verify:
    name: download what users download, then check it
    # Windows, because one of these questions cannot be asked anywhere else: a
    # checksum says the bytes did not change and nothing about who signed them.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: which release this is
        id: which
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "no tag to check"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checking $tag"

      - name: download every published file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p published
          cd published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l

      # A release missing one file looks almost exactly like a finished one,
      # which is why this counts rather than glances. Eight archives - the five
      # of the command line and the three of the window - the checksums, the
      # bill of materials and the two statements.
      - name: everything a release is made of is there
        id: assets
        continue-on-error: true
        shell: bash
        working-directory: published
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          missing=0
          expected=(
            "certdoctor_${version}_windows_amd64.zip"
            "certdoctor_${version}_windows_arm64.zip"
            "certdoctor_${version}_linux_amd64.tar.gz"
            "certdoctor_${version}_linux_arm64.tar.gz"
            "certdoctor_${version}_macos_arm64.tar.gz"
            "certdoctor-gui_${version}_windows_amd64.zip"
            "certdoctor-gui_${version}_linux_amd64.tar.gz"
            "certdoctor-gui_${version}_macos_arm64.tar.gz"
          )
          for name in "${expected[@]}"; do
            if [ ! -f "$name" ]; then
              echo "missing: $name"
              missing=1
            fi
          done
          shopt -s nullglob
          archives=(*.zip *.tar.gz)
          shopt -u nullglob
          echo "archives: ${#archives[@]}"
          if [ "${#archives[@]}" != "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} archives"
            missing=1
          fi
          # Named with the verify- prefix rather than by suffix alone, because
          # the prefix is the only thing keeping these four at the end of the
          # download list, and a suffix is happy with a file that lost it.
          for needed in verify-SHA256SUMS.txt "verify-certdoctor_${version}.spdx.json" \
              "verify-certdoctor_${version}.provenance.sigstore.json" \
              "verify-certdoctor_${version}.sbom.sigstore.json"; do
            if [ ! -f "$needed" ]; then
              echo "missing: $needed"
              missing=1
            fi
          done
          # One installer for a release and none for a release candidate - a
          # hyphen in the tag, the rule release.yml marks a pre-release by and
          # build_msi.py refuses one by (ADR148). Windows Installer reads only
          # the three numbers of a version, so a candidate's installer would
          # carry the release's own version.
          shopt -s nullglob
          installers=(*.msi)
          shopt -u nullglob
          echo "installers: ${#installers[@]}"
          case "$TAG" in
            *-*)
              if [ "${#installers[@]}" != "0" ]; then
                echo "a release candidate carries an installer: ${installers[*]}"
                missing=1
              fi ;;
            *)
              if [ "${#installers[@]}" != "1" ] || [ ! -f "certdoctor-setup_${version}_windows_amd64.msi" ]; then
                echo "expected one installer, certdoctor-setup_${version}_windows_amd64.msi"
                missing=1
              fi ;;
          esac
          test "$missing" = "0"
          echo "every expected file is published"

      - name: the checksums a user is told to compare
        id: checksums
        continue-on-error: true
        shell: bash
        working-directory: published
        run: sha256sum -c verify-SHA256SUMS.txt

      # Run against real downloads, as written on the release page, for each
      # program. The provenance one answers for the Linux archives, which
      # nothing signed. The predicate type is given because gh asks for
      # provenance unless told otherwise, and a wrong URI answers "no
      # attestation found".
      - name: the two commands the notes tell people to run
        id: commands_api
        continue-on-error: true
        shell: bash
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          for program in certdoctor certdoctor-gui; do
            linux="${program}_${TAG#v}_linux_amd64.tar.gz"
            windows="${program}_${TAG#v}_windows_amd64.zip"
            echo "where it came from, on a file nothing signed: $linux"
            gh attestation verify "$linux" -R "$GITHUB_REPOSITORY"
            echo "what is inside, on a signed file: $windows"
            gh attestation verify "$windows" -R "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      # The notes promise these work offline with --bundle, and a person behind
      # a proxy that blocks the API is exactly who this program is for.
      - name: the same two commands with no network to the API
        id: commands_offline
        continue-on-error: true
        shell: bash
        working-directory: published
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          for program in certdoctor certdoctor-gui; do
            linux="${program}_${TAG#v}_linux_amd64.tar.gz"
            windows="${program}_${TAG#v}_windows_amd64.zip"
            gh attestation verify "$linux" -R "$GITHUB_REPOSITORY" \
              --bundle "verify-certdoctor_${TAG#v}.provenance.sigstore.json"
            gh attestation verify "$windows" -R "$GITHUB_REPOSITORY" \
              --bundle "verify-certdoctor_${TAG#v}.sbom.sigstore.json" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      # The step this job runs on Windows for. Every archive and every program
      # and library in each, not the first one found: signing two of three and
      # publishing the third unsigned is a mistake that looks like nothing at
      # all on the page. The window's archive carries the software renderer
      # beside it, and a library beside a signed program is the one file a
      # tamperer would swap - its two files are named by the pin they were
      # fetched by, so an archive that lost one is refused here as well.
      - name: every Windows program and library is signed, stamped, by our certificate, and the command line starts
        id: signatures
        continue-on-error: true
        shell: pwsh
        working-directory: published
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          $line = Select-String -Path ../.github/signing-certificates.txt -Pattern '^windows-code-signing\s+([0-9a-f]{64})\s'
          if (-not $line) { throw "could not read the pinned certificate out of .github/signing-certificates.txt" }
          $pinned = $line.Matches[0].Groups[1].Value
          "pinned: $pinned"

          $renderer = @(Select-String -Path ../.github/mesa-dist-win -Pattern '^file=\S*/([^/\s]+)\s' |
            ForEach-Object { 'opengl/' + $_.Matches[0].Groups[1].Value })
          if ($renderer.Count -lt 1) { throw "could not read the software renderer's files out of .github/mesa-dist-win" }
          "renderer: $($renderer -join ', ')"

          $version = $env:TAG.TrimStart('v')
          $archives = [ordered]@{
            "certdoctor_${version}_windows_amd64.zip"     = @('certdoctor.exe')
            "certdoctor_${version}_windows_arm64.zip"     = @('certdoctor.exe')
            "certdoctor-gui_${version}_windows_amd64.zip" = @('certdoctor-gui.exe', 'certdoctor.exe') + $renderer
          }
          $zips = @(Get-ChildItem -Filter *windows*.zip)
          if ($zips.Count -ne $archives.Count) { throw "expected $($archives.Count) Windows archives, found $($zips.Count)" }

          $checked = 0
          $commandLine = @{}
          foreach ($name in $archives.Keys) {
            if (-not (Test-Path -LiteralPath $name)) { throw "missing: $name" }
            $into = Join-Path $PWD ("unpacked_" + [IO.Path]::GetFileNameWithoutExtension($name))
            Expand-Archive -LiteralPath $name -DestinationPath $into -Force
            $found = @(Get-ChildItem -LiteralPath $into -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.dll' } |
              ForEach-Object { $_.FullName.Substring($into.Length + 1).Replace('\', '/') } | Sort-Object)
            $wanted = @($archives[$name] | Sort-Object)
            if (($found -join ', ') -ne ($wanted -join ', ')) {
              throw "$name holds $($found -join ', '), and should hold $($wanted -join ', ')"
            }

            foreach ($rel in $found) {
              $file = Join-Path $into $rel
              $sig = Get-AuthenticodeSignature -LiteralPath $file
              "$name -> ${rel}: $($sig.Status)"
              if ($sig.Status -ne 'Valid') { throw "$rel in ${name}: the signature status is $($sig.Status)" }
              # Without a timestamp the signature dies when the certificate
              # expires, so its absence is a defect rather than a detail.
              if (-not $sig.TimeStamperCertificate) { throw "$rel in ${name}: the signature carries no timestamp" }
              $bytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash($sig.SignerCertificate.RawData)
              $actual = ($bytes | ForEach-Object { $_.ToString('x2') }) -join ''
              if ($actual -ne $pinned) { throw "$rel in $name was signed by a DIFFERENT certificate: $actual" }
              $checked++
            }

            $commandLine[$name] = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $into 'certdoctor.exe')).Hash
            # The runner is amd64, and Windows on amd64 does not run an arm64
            # program, so only the builds for this machine are started.
            if ($name -like '*_windows_amd64.zip') {
              $said = (& (Join-Path $into 'certdoctor.exe') --version | Select-Object -First 1)
              if ($said -ne "certdoctor: $version") { throw "certdoctor.exe in $name says '$said', and this release is $version" }
              "$name -> certdoctor.exe starts and says $said"
            }
          }
          # The signing script signs each distinct file once and copies it, so
          # the command line in the window's archive is the very file the
          # command line's archive carries - two signatures would be two files.
          if ($commandLine["certdoctor_${version}_windows_amd64.zip"] -ne $commandLine["certdoctor-gui_${version}_windows_amd64.zip"]) {
            throw "certdoctor.exe in the window's archive is not the file the command line's archive carries"
          }
          "$checked file(s) signed by the pinned certificate, each with a timestamp"

      # The installer is what an administrator runs with the machine's highest
      # rights (ADR148), so it is checked the way the programs are, on a line
      # of its own in the verdict. Its files are unpacked with an
      # administrative install, which installs nothing, and compared with the
      # window's archive byte for byte: an installer built before the card
      # signed the programs would carry unsigned copies inside a valid
      # signature. A release candidate publishes no installer, and the count
      # above says whether that held.
      - name: the installer is signed, stamped, by our certificate, and carries the signed files
        id: installer
        continue-on-error: true
        shell: pwsh
        working-directory: published
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          $installers = @(Get-ChildItem -Filter *.msi)
          if ($installers.Count -eq 0) { "no installer is published, so there is nothing to check here"; exit 0 }
          $pinLine = Select-String -Path ../.github/signing-certificates.txt -Pattern '^windows-code-signing\s+([0-9a-f]{64})\s'
          if (-not $pinLine) { throw "could not read the pinned certificate out of .github/signing-certificates.txt" }
          $pinned = $pinLine.Matches[0].Groups[1].Value
          $version = $env:TAG.TrimStart('v')
          $archive = "certdoctor-gui_${version}_windows_amd64.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "missing: $archive, which the installer is made of" }
          $window = Join-Path $env:RUNNER_TEMP 'installer_window_archive'
          Expand-Archive -LiteralPath $archive -DestinationPath $window -Force
          $listing = {
            param($dir)
            @(Get-ChildItem -LiteralPath $dir -Recurse -File | ForEach-Object {
              $_.FullName.Substring($dir.Length + 1).Replace('\', '/') + ' ' + (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            } | Sort-Object)
          }
          $want = & $listing $window
          foreach ($msi in $installers) {
            $sig = Get-AuthenticodeSignature -LiteralPath $msi.FullName
            "$($msi.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "$($msi.Name): the signature status is $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw "$($msi.Name): the signature carries no timestamp" }
            $bytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash($sig.SignerCertificate.RawData)
            $actual = ($bytes | ForEach-Object { $_.ToString('x2') }) -join ''
            if ($actual -ne $pinned) { throw "$($msi.Name) was signed by a DIFFERENT certificate: $actual" }

            # msiexec with its arguments in a variable and a limit on the wait:
            # without a file it waits for a help window nobody can close.
            $image = Join-Path $env:RUNNER_TEMP ('installer_image_' + $msi.BaseName)
            New-Item -ItemType Directory -Force -Path $image | Out-Null
            $log = Join-Path $env:RUNNER_TEMP ($msi.BaseName + '.admin.log')
            $argv = @('/a', ('"' + $msi.FullName + '"'), '/qn', ('TARGETDIR="' + $image + '"'), '/l*v', ('"' + $log + '"'))
            $p = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit(600000)) { throw "msiexec /a $($msi.Name) did not finish in ten minutes" }
            if ($p.ExitCode -ne 0) { throw "msiexec /a $($msi.Name) exited $($p.ExitCode)" }
            $inside = Join-Path $image 'PFiles64\Cert Doctor'
            if (-not (Test-Path -LiteralPath $inside)) { throw "$($msi.Name) unpacks no 'Cert Doctor' folder under Program Files" }
            $have = & $listing $inside
            if (($have -join "`n") -ne ($want -join "`n")) {
              throw ("$($msi.Name) does not carry the window archive's files byte for byte`n  installer: " +
                ($have -join ', ') + "`n  archive:   " + ($want -join ', '))
            }
            "$($msi.Name): by the pinned certificate, with a timestamp, and its $($have.Count) files are the window archive's, byte for byte"
          }

      # The readme and the site point at /releases/latest, so "published" and
      # "what people get" are the same thing only while this holds. Asked of the
      # API rather than of the event, because a dispatch has no event and a
      # prerelease is supposed to be skipped here.
      - name: a full release is the one people are offered
        id: latest
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" = "true" ]; then
            echo "$TAG is a prerelease, so it must not be latest and is not checked here"
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "latest is $latest, this release is $TAG"
          test "$latest" = "$TAG"

      # Every check above carries continue-on-error, so this step is reached
      # whatever happened, and this is the one that decides. A person reads a
      # release page once and wants the whole list of what is wrong with it,
      # not the first line.
      #
      # outcome and not conclusion: continue-on-error rewrites conclusion to
      # success and leaves outcome alone, so reading conclusion here would
      # report every check as passing however it went.
      - name: one verdict, not the first failure
        if: always()
        shell: bash
        env:
          ASSETS: ${{ steps.assets.outcome }}
          CHECKSUMS: ${{ steps.checksums.outcome }}
          COMMANDS_API: ${{ steps.commands_api.outcome }}
          COMMANDS_OFFLINE: ${{ steps.commands_offline.outcome }}
          SIGNATURES: ${{ steps.signatures.outcome }}
          INSTALLER: ${{ steps.installer.outcome }}
          LATEST: ${{ steps.latest.outcome }}
        run: |
          set -euo pipefail
          failed=0
          report() {
            printf '  %-56s %s\n' "$2" "$1"
            if [ "$1" != "success" ]; then
              failed=1
            fi
          }
          echo "what this release page answers for:"
          report "$ASSETS" "everything a release is made of is there"
          report "$CHECKSUMS" "the checksums a user is told to compare"
          report "$COMMANDS_API" "the commands the notes tell people to run"
          report "$COMMANDS_OFFLINE" "the same commands with no network"
          report "$SIGNATURES" "every Windows program and library by our certificate"
          report "$INSTALLER" "the installer by our certificate, with the signed files"
          report "$LATEST" "a full release is the one people are offered"
          echo
          if [ "$failed" != "0" ]; then
            echo "This release page does not answer for itself."
            echo "Every line above that is not success is a separate thing to fix,"
            echo "and they are all listed rather than found one release at a time."
            exit 1
          fi
          echo "the release page answers for itself"
