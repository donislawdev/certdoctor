# certdoctor CI.
#
# TWO BUILD CONFIGURATIONS, AND THE DIFFERENCE MATTERS.
#
# The race detector requires cgo and refuses to run without it. The release
# binary must be built with cgo disabled to stay static, because the container
# mode depends on a binary that runs where there is no libc to link against.
# These are two configurations, not a conflict.
#
# The trap this file is written against: setting CGO_ENABLED=0 globally, because
# that is what the release build needs, removes race detection from the whole
# pipeline. The refusal is loud, so it does not disappear quietly - it
# disappears together with the step somebody then deletes as "not working".
# Hence CGO_ENABLED is set per job and never at the top of this file.
#
# The release job proves the artefact is static instead of trusting that the
# variable was set. A cgo-linked binary runs perfectly on a developer machine
# and fails only in a minimal container, so the failure looks like success
# exactly where it would be noticed last.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS joined on 2026-08-03. Until then every claim about this program
        # on macOS rested on cross-compilation, which proves it builds and
        # nothing about whether it runs. It does NOT answer the open question
        # about enumerating the macOS trust store without cgo - that needs a
        # probe, and the probe lives outside this repository.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofmt -l lists unformatted files and still exits 0. Used as a bare step
      # it would be a green gate that never blocks anything.
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        shell: bash
        run: go vet ./...

      # A dependency rarely arrives by decision. It arrives as somebody else's
      # transitive import, in a diff that looks like it only touched go.sum.
      # This is the only mechanism that makes the rule about new dependencies
      # something other than prose.
      - name: dependencies are the declared ones
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -v '^\s*#' tools/expected-modules.txt | grep -v '^\s*$' | sort)"
          observed="$(go list -m all | sort)"
          if [ "$expected" != "$observed" ]; then
            echo "The module list differs from tools/expected-modules.txt."
            echo "Read that file before changing it - a licence check belongs with the edit."
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$observed") || true
            exit 1
          fi

      # Race detection runs on Linux, where the image is known to carry a C
      # compiler. Whether the Windows image exposes one on PATH was NOT verified,
      # and a job that fails for reasons unrelated to the change teaches people
      # to ignore CI.
      - name: test with the race detector
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: test without the race detector
        if: runner.os != 'Linux'
        shell: bash
        run: go test -count=1 ./...

      # WHY THIS RUNS ON WINDOWS AND NOT ON LINUX, which is the opposite of the
      # obvious choice. The floors in tools/coverage-floor.txt were MEASURED on
      # Windows, and coverage genuinely differs between the two: the privilege
      # package compiles a different file on each platform, and one test in the
      # output package is skipped where file mode bits are not the mechanism.
      # Running the gate against floors measured somewhere else would fail for a
      # reason that has nothing to do with the change being tested, and a gate
      # that fails for unrelated reasons is a gate people learn to ignore.
      #
      # MEASURED ON LINUX TOO, 2026-08-03, and that is why this now runs on both.
      # Every package came out at or above the floor measured on Windows, two of
      # them well above it: the privilege package reaches 100 percent there
      # because the file it compiles is three lines, and the output package
      # reaches 78.3 because the test about file mode bits is not skipped. The
      # floors stay at the Windows numbers, since those are the lower ones and a
      # floor has to hold on the platform that struggles most.
      #
      # Running it on both is strictly more cover: a change that leaves Windows
      # alone and drops Linux is a real signal, and until now nothing would have
      # seen it.
      - name: coverage is at or above its floor
        if: runner.os != 'macOS'
        shell: bash
        run: bash tools/coverage-gate.sh

      # THE ONLY STEP IN THIS FILE THAT RUNS THE PROGRAM RATHER THAN TESTING IT.
      #
      # Everything above exercises the code in process with the outside world
      # replaced - no real disk, no real clock, no terminal. That is the right
      # shape for a unit and it cannot answer whether the thing we ship starts,
      # keeps its output on the right channel, or leaves a file behind. Three
      # findings in this project came from running the binary and from nothing
      # else, so the gap is measured rather than suspected.
      #
      # It runs on all three systems on purpose. Two of those three findings
      # were invisible from the system this is developed on.
      - name: the shipped binary behaves as promised
        shell: bash
        run: bash tools/acceptance.sh

  # WHY THE CHECK SET IS NARROW, and this is measured rather than cautious.
  #
  # The default set was run over the whole tree on 2026-08-03 and produced
  # exactly one finding: a suggestion to convert one struct to another instead
  # of writing the fields out. That is a simplification, not a defect - and the
  # rule this project follows is to enable the checks that catch a SILENT
  # ERROR and skip the ones with an opinion about style, because a guard that
  # shouts about correct code is switched off within a week.
  #
  # SA is "outright wrong or pointless", U is unused code. Both classes were
  # measured over the tree and reported nothing, so this enters CI without a
  # backlog of pre-existing noise to grandfather in.
  #
  # Pinned to a version rather than @latest. A tool that changes under us turns
  # an unrelated commit red, which teaches people that red means nothing.
  #
  # MOVED 2025.1.1 -> 2026.2.1 ON 2026-09-01, BECAUSE THE TOOLCHAIN MOVED AND
  # THIS TOOL READS ITS OUTPUT. Measured that day against Go 1.27.0: 2025.1.1
  # answered "export data version 4 is greater than maximum supported version 2"
  # for four standard library packages and exited 1, which is a red job that says
  # nothing about this code. 2026.2.1 - released 2026-08-21, and the release note
  # says it covers Go 1.27 - runs clean here. Licence read at
  # https://raw.githubusercontent.com/dominikh/go-tools/2026.2.1/LICENSE on
  # 2026-09-01: MIT, Copyright (c) 2016 Dominik Honnef. It is a CI tool and
  # never reaches a user, so it is the lightest of the three sieves in docs/22
  # section 7a - and it is still read rather than assumed.
  #
  # MOVED 2026.2.1 -> 2026.2.2 ON 2026-10-14, FOR THE SAME REASON ONE STEP
  # LATER. The toolchain went to 1.27.2, and 2026.2.1 answered "export data
  # version 5 is greater than maximum supported version 4" for five standard
  # library packages - measured on Windows that day. The 2026.2.2 release note
  # says it supports the updated export data format used by Go 1.27.2. Released
  # 2026-10-12 per proxy.golang.org. Licence read at
  # https://raw.githubusercontent.com/dominikh/go-tools/2026.2.2/LICENSE on
  # 2026-10-14: MIT, Copyright (c) 2016 Dominik Honnef, unchanged.
  static-analysis:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        shell: bash
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 -checks=SA,U ./...

  # A security-adjacent tool with no dependencies still runs on a standard
  # library that gets advisories of its own, and the Go version is pinned in
  # go.mod - so the thing most likely to carry a known vulnerability here is
  # the toolchain, not somebody else's package.
  #
  # Neither this nor staticcheck enters go.mod. They are separate processes run
  # over our code, which is the category where a licence has no bearing on what
  # we ship - the release binary links neither of them.
  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # THE PIN IS A MEASUREMENT AND NOT THE NEWEST NUMBER, and the version it
      # replaced is named here because the failure was invisible from the
      # owner's machine.
      #
      # v1.1.4 stood here until 2026-09-03 and PANICKED on this toolchain -
      # "panic: unexpected expr: *ast.KeyValueExpr" raised inside the SSA
      # builder of x/tools v0.29.0, which that release pins. Measured 3 runs out
      # of 3 in golang:1.27-alpine and not once on Windows, so this job was red
      # for a defect in the tool rather than for anything in this tree. That is
      # the OBS87 family: a pinned analyser left behind by a new toolchain.
      #
      # v1.7.0 pins x/tools v0.49.0 and answers "No vulnerabilities found." in
      # the same container AND on Windows - both measured 2026-09-03, before
      # this line changed.
      #
      # BSD-3-Clause, read at source 2026-09-03 at
      # https://raw.githubusercontent.com/golang/vuln/v1.7.0/LICENSE - published
      # 2026-08-13 per proxy.golang.org/golang.org/x/vuln/@latest. This is
      # inviolable rules 5 and 23 applied to a workflow pin, which is the one
      # place a dependency reaches this project without passing the licence
      # sieve in tools/expected-modules.txt.
      #
      # MOVED v1.7.0 -> v1.9.0 ON 2026-10-14, by the owner's decision to take
      # every pin to its newest release together with the toolchain - so this
      # time the pin IS the newest number, and it still went in on a
      # measurement. v1.9.0, published 2026-10-11 per
      # proxy.golang.org/golang.org/x/vuln/@latest, answered "No vulnerabilities
      # found." on Windows and in golang:1.27-alpine carrying go1.27.2, over the
      # tree with every linked module moved too.
      # BSD-3-Clause, read at source that day at
      # https://raw.githubusercontent.com/golang/vuln/v1.9.0/LICENSE, unchanged.
      - name: govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # THE ONE PROBE THAT HAS TO BE PUBLIC, and it is worth saying why since every
  # other one lives outside this repository.
  #
  # It answers whether the macOS trust anchors can be listed with cgo disabled.
  # That is the second reason this project is written in Go - cross-compiling
  # without a C toolchain - and it has been an open question since before the
  # first line of code, because nobody had a Mac. CI has one, and CI only sees
  # what is committed, so this probe cannot live with the others.
  #
  # CGO_ENABLED IS SET EXPLICITLY AND THAT IS THE WHOLE POINT. The default on a
  # developer machine is 1, so a probe built without saying so would answer a
  # question nobody asked.
  #
  # IT BLOCKS, and the failure it blocks on is narrow: no route enumerated
  # anything. That result would refute the expectation written into the probe
  # and weaken a decision already taken, which is exactly the kind of thing that
  # should stop a pipeline rather than sit in a log. If it turns out to depend
  # on the runner's keychain rather than on the platform, it becomes reporting
  # only - with the reason written down, not silently.
  #
  # IT HAS A REVIEW DATE, because "we will change it if it turns out to be
  # flaky" has no trigger and nobody is reminded. On 2026-09-03, or at the first
  # failure that is not about the code, decide one of two things: the question
  # is answered and this job goes away, or it stays and stops blocking. A job
  # that reddens for reasons unrelated to the change is how a pipeline teaches
  # people that red means nothing, and that is the most expensive thing in here
  # to lose.
  macos-anchors:
    name: macos trust anchors
    runs-on: macos-latest
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: enumerate without cgo
        shell: bash
        working-directory: tools/probe-macos-truststore
        env:
          CGO_ENABLED: "0"
        run: go run .

  # EVERY TARGET THAT WILL BE RELEASED, not just the one the runner happens to
  # be. This job used to build for Linux alone, so the claim that certdoctor
  # cross-compiles rested on somebody having tried it by hand once. The packages
  # that make that claim worth checking are the two split by //go:build -
  # privilege reads a process token on Windows and an effective user id
  # elsewhere, render asks the console for its code page on Windows and nothing
  # anywhere else - and they are exactly the ones a Linux-only build never
  # compiles.
  release-build:
    name: release build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build with cgo disabled
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o dist/certdoctor ./cmd/certdoctor

      # Checked in both directions, because the wording of file(1) has changed
      # between releases and a single positive match could start passing for the
      # wrong reason.
      #
      # Linux only, and that is a limit rather than an oversight: "statically
      # linked" is how file(1) describes an ELF binary. A PE or a Mach-O carries
      # no such wording, so running this on them would either pass for the wrong
      # reason or fail for one. What the other targets get instead is the second
      # signal below, which asks the toolchain rather than the linker and works
      # on every artefact.
      - name: prove the artefact is static
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          description="$(file dist/certdoctor)"
          echo "$description"
          if printf '%s' "$description" | grep -q 'dynamically linked'; then
            echo "FAIL: the release binary is dynamically linked. It would not run in a minimal container."
            exit 1
          fi
          if ! printf '%s' "$description" | grep -qE 'statically linked|static-pie linked'; then
            echo "FAIL: file(1) does not describe this binary as static, so the check cannot confirm anything."
            exit 1
          fi

      # A second, independent signal. file(1) reports what the linker produced,
      # this reports what the toolchain was told - two different questions, and
      # a check that passed both did not pass the same check twice.
      #
      # Measured on 2026-08-02 by cross-building this command both ways: the
      # embedded build settings read CGO_ENABLED=0 and CGO_ENABLED=1
      # respectively, so this line does discriminate.
      - name: prove cgo was disabled
        shell: bash
        run: |
          set -euo pipefail
          go version -m dist/certdoctor
          if ! go version -m dist/certdoctor | grep -q 'CGO_ENABLED=0'; then
            echo "FAIL: the binary does not record CGO_ENABLED=0."
            exit 1
          fi
