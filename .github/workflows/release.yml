# certdoctor release - the first of three phases, and nothing here publishes.
#
# A tag starts a release and a person finishes it. This builds the five
# archives of the command line and the three of the window, attests where they
# came from, and opens an EMPTY draft. The signing
# happens on the maintainer's machine, where the Windows key is on a card that
# cannot be exported and the Apple key is in a keychain on a Mac -
# .github/scripts/sign_release.py, which then asks attest-release.yml for the
# statement about the signed bytes. The maintainer publishes the draft, and
# verify-release.yml checks the published page the way a user would. ADR116
# decision 1, after the release pipeline of the maintainer's other Go project.
#
# Running this by hand from the Actions tab builds everything and attaches it to
# the run, so the build can be tried without a tag being spent - and the signing
# rehearsed on it, with sign_release.py --rehearsal <run>, which uploads
# nothing. The publish job is the only one that writes anything, and it is
# fenced behind the tag.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read only by default. The one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: the tree is green and the tag agrees with the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Asked of the program rather than read out of the source, so this cannot
      # drift from what --version and every report will say.
      - name: what version the code says
        id: version
        shell: bash
        run: |
          set -euo pipefail
          said="$(go run ./cmd/certdoctor --version | head -n 1)"
          version="${said#certdoctor: }"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "--version said \"${said}\", which does not carry a version this can read."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "the code says ${version}"

      # The suite above is not the whole of CI - the coverage gate, staticcheck,
      # govulncheck and the acceptance run against the binary all live in ci.yml
      # and none of them runs here. Without this, the only thing between a red
      # tree and a release is somebody remembering.
      #
      # Asked BY NAME rather than as "were all the checks green". A query for
      # every check answers about whatever happened to report, so a workflow
      # that never ran reads exactly like one that passed.
      - name: ci was green on this exact commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verdict="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --commit="${GITHUB_SHA}" \
            --limit 1 --json status,conclusion \
            --jq 'if length == 0 then "never ran" else .[0] | "\(.status) \(.conclusion)" end')"
          echo "ci on ${GITHUB_SHA}: ${verdict}"
          if [ "$verdict" != "completed success" ]; then
            echo "The ci workflow on this commit says: ${verdict}."
            echo "A release is built from a commit ci has passed, so push the commit,"
            echo "wait for ci, and tag it only then."
            exit 1
          fi

      # A release page points at the changelog, and a changelog with no section
      # for this version points back at nothing. The other half matters more:
      # entries left under Unreleased are changes that went out without being
      # described.
      - name: the changelog is closed for this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! awk -v heading="## [${version}]" 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}."
            echo "Move what is under [Unreleased] into a dated section for this version first."
            exit 1
          fi
          left="$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '[^[:space:]]' || true)"
          if [ "$left" != "0" ]; then
            echo "CHANGELOG.md still has ${left} line(s) under [Unreleased]."
            echo "Those are changes that would go out undescribed. Move them into ${version}."
            exit 1
          fi
          echo "the changelog is closed for ${version}"

      # The version is raised by the maintainer and nobody else. A tag that
      # disagrees with the code would put one number on the release page and
      # another in every report the release writes, and the report is the copy
      # that turns up months later attached to somebody's question.
      - name: the tag says the same as the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$code" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and certdoctor --version says ${code}."
            echo "Raise the version in the code first, commit it, then tag that commit."
            exit 1
          fi
          echo "the tag and the code agree on ${code}"

      # The suite below compiles the window with cgo, and GLFW in it needs these
      # four packages on Linux - the same step the ci test job carries, for the
      # reason it gives (ADR124 (f)). Missing here, the first run of this
      # workflow after the window arrived stopped at wayland-client-core.h.
      - name: the graphics headers the window needs
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # Last, because it is the slow one and every check above can refuse in
      # seconds. A release built from a red tree is the one kind of release that
      # cannot be taken back, because the binaries are already on somebody's
      # disk. The same command the ci test job runs on Linux.
      - name: test with the race detector
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  # The window, certdoctor-gui, on the three systems D21 ships it for. It reaches
  # OpenGL and the windowing system through C, so it is built with cgo on the
  # system it is for rather than cross compiled with the command line - the
  # reason build_window.sh gives. Nothing is packed here: build_release.sh packs
  # every archive in one place, the window's with the command line's own build.
  window:
    name: build the window on ${{ matrix.runner }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # Every leg runs to its end, so one run says everything that is wrong.
      # A release needs all three, and the build job waits for all of them.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The same four packages the ci test job installs, for the same reason
      # it gives: GLFW compiles for X11 and Wayland both (ADR124 (f)).
      - name: the graphics headers the window needs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # Into RUNNER_TEMP and never into the checkout, for the reason the build
      # job gives. On Windows the script also fetches the software renderer and
      # checks it against its pin before anything is unpacked (ADR125 point 5).
      - name: build the window
        shell: bash
        run: bash .github/scripts/build_window.sh "${{ matrix.goos }}/${{ matrix.goarch }}" "$RUNNER_TEMP/window"

      # Named after the target, which is the directory build_release.sh looks
      # for it in. An artefact keeps no file modes, and that script sets them.
      - name: keep the window
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certdoctor-gui_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ runner.temp }}/window
          if-no-files-found: error

  build:
    name: build the command line and pack every archive
    needs: [check, window]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Each into a directory of its own name, certdoctor-gui_<os>_<arch>,
      # which is what build_release.sh reads. download-artifact does that when
      # the pattern matches more than one artefact, and unpacks a lone match
      # into the path itself (src/download-artifact.ts at the pinned commit,
      # read 2026-11-11). A run that got here has all three, since this job
      # needs every leg of the window job, and a directory missing all the
      # same is refused by the script rather than packed around.
      - name: fetch the windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: certdoctor-gui_*
          path: ${{ runner.temp }}/windows

      # One runner cross compiles the five builds of the command line, because
      # it has no C in it. That is the same property the static build checks
      # in ci.yml exist to keep, and building every target from one place keeps
      # it visible. The window's builds come from the job above, and the third
      # argument is what makes this a release: without it the script packs the
      # command line alone and says so.
      #
      # Into RUNNER_TEMP and never into the checkout: every binary records
      # whether its tree had uncommitted changes, an untracked archive counts,
      # and the bill of materials refuses such a build.
      - name: build, write the bill of materials, pack
        shell: bash
        run: bash .github/scripts/build_release.sh "${{ needs.check.outputs.version }}" "$RUNNER_TEMP/release" "$RUNNER_TEMP/windows"

      # The bill of materials read by somebody else's understanding of SPDX as
      # well as ours. The tests of cmd/sbom hold the document to what we read
      # SPDX 2.3 to say, so a misreading passes all of them, and a document a
      # scanner cannot parse is a release whose components nobody can look up.
      # spdx-tools is the SPDX project's own validator. Once a release, on the
      # five real builds, and on a run by hand as well - not in ci.yml.
      #
      # Into a virtual environment in RUNNER_TEMP, from a list pinned to the
      # bytes of every file, because what this job leaves is what the release
      # attests. The version is named rather than read from the document, so a
      # document in another version than the attestation promises is refused.
      # pyspdxtools prints nothing when the document is valid.
      - name: the bill of materials is valid SPDX
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: -r .github/requirements-spdx.txt
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" --version SPDX-2.3 \
            -i "$RUNNER_TEMP/release/dist/verify-certdoctor_${{ needs.check.outputs.version }}.spdx.json"
          echo "spdx-tools reads the bill of materials as valid SPDX-2.3"

      - name: keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/release/dist/*
          if-no-files-found: error

  # What the Windows installer DOES, asked on a clean Windows machine before
  # anything is signed (ADR148): the window's archive of this very build, made
  # into an installer by the script the signing step uses, installed, built
  # again and installed over itself, and removed. Nothing here is published -
  # the installer people download is built on the machine with the card, from
  # the signed archive. A release candidate gets no installer, so there is
  # nothing to install for one. The draft waits for this job.
  installer:
    name: the Windows installer installs, replaces itself and leaves nothing behind
    needs: [check, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build

      # Two builds of one version, because every build carries a new
      # ProductCode, and the second installed over the first is what a rebuild
      # held in a feed's moderation does on somebody's machine. WiX at the
      # version build_msi.py builds with, which refuses any other.
      - name: build the installer twice
        id: built
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if ($env:VERSION.Contains('-')) {
            "$env:VERSION is a release candidate, which gets no installer"
            "built=no" >> $env:GITHUB_OUTPUT
            exit 0
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix exited $LASTEXITCODE" }
          foreach ($leg in 'first', 'second') {
            $out = Join-Path $env:RUNNER_TEMP $leg
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            python .github/scripts/build_msi.py --tag "v$env:VERSION" --archives (Join-Path $env:RUNNER_TEMP 'build') --out-dir $out
            if ($LASTEXITCODE -ne 0) { throw "build_msi.py refused v$env:VERSION" }
          }
          "built=yes" >> $env:GITHUB_OUTPUT

      # Each check is asked of what Windows did, not of what the source says:
      # the programs' versions in the installer's own table, the folder
      # against the archive byte for byte, the machine's PATH as a new process
      # reads it, the shortcut's target, the entry in Programs and Features.
      # The versions come first because they decide upgrades: a program
      # without one is a file Windows Installer leaves in place, and an
      # upgrade then reports the new version over the old program (measured
      # on Windows Server 2025, 2026-11-13).
      - name: install, install a rebuild over it, uninstall
        if: steps.built.outputs.built == 'yes'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $name = 'Cert Doctor'
          $installDir = Join-Path $env:ProgramFiles $name
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) ($name + '.lnk')
          $regKey = 'HKLM:\Software\DonislawDev\' + $name
          $first = (Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'first') -Filter *.msi).FullName
          $second = (Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'second') -Filter *.msi).FullName
          $script:failed = 0
          function Check($ok, [string]$what) {
            if ($ok) { Write-Host "ok      $what" } else { Write-Host "FAILED  $what"; $script:failed++ }
          }
          function Listing([string]$dir) {
            if (-not (Test-Path -LiteralPath $dir)) { return '(no folder)' }
            return (@(Get-ChildItem -LiteralPath $dir -Recurse -File | ForEach-Object {
              $_.FullName.Substring($dir.Length + 1).Replace('\', '/') + ' ' + (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            } | Sort-Object) -join "`n")
          }
          function Entries {
            return @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq $name })
          }
          function Ours-On-Path {
            return @(([Environment]::GetEnvironmentVariable('Path', 'Machine')).Split(';') | Where-Object { $_.TrimEnd('\') -eq $installDir })
          }
          # msiexec with its arguments in a variable and a limit on the wait:
          # a quote that swallows the file name leaves it waiting for a help
          # window nobody can close.
          function Msi([string]$verb, [string]$file, [string]$log) {
            $argv = @($verb, ('"' + $file + '"'), '/qn', '/norestart', '/l*v', ('"' + (Join-Path $env:RUNNER_TEMP $log) + '"'))
            $p = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\msiexec.exe') -ArgumentList $argv -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { throw "msiexec $verb $file did not finish in ten minutes" }
            Write-Host "msiexec $verb $(Split-Path -Leaf $file) -> $($p.ExitCode)"
            return $p.ExitCode
          }

          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $wi, @($first, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `FileName`, `Version` FROM `File`'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $versions = @{}
          while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
            $file = ($rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1)) -split '\|')[-1]
            $versions[$file] = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(2))
          }
          $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
          foreach ($program in 'certdoctor.exe', 'certdoctor-gui.exe') {
            Check ($versions[$program] -eq "$version.0") "the installer records $program as version $version.0 ($($versions[$program]))"
          }

          $window = Join-Path $env:RUNNER_TEMP 'window-archive'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "build\certdoctor-gui_${version}_windows_amd64.zip") -DestinationPath $window -Force
          $want = Listing $window
          function Check-Installed {
            $entries = @(Entries)
            Check ($entries.Count -eq 1) "one entry in Programs and Features ($($entries.Count))"
            if ($entries.Count -ge 1) {
              Check ($entries[0].DisplayVersion -eq $version) "it says $version ($($entries[0].DisplayVersion))"
              Check ($entries[0].Publisher -eq 'DonislawDev') "publisher DonislawDev ($($entries[0].Publisher))"
            }
            Check ((Listing $installDir) -eq $want) "the folder holds the window archive, byte for byte"
            Check (@(Ours-On-Path).Count -eq 1) "the install folder is on the machine PATH once ($(@(Ours-On-Path).Count))"
            Check (-not (Test-Path -LiteralPath (Join-Path $installDir 'opengl32.dll'))) 'opengl32.dll is not in the folder on PATH'
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            $said = (@(& cmd.exe /c 'certdoctor --version' 2>&1)[0] | Out-String).Trim()
            Check ($said -eq "certdoctor: $version") "certdoctor found on PATH by a new process says $version ($said)"
            Check (Test-Path -LiteralPath $shortcut) "the Start menu has the shortcut for every account"
            if (Test-Path -LiteralPath $shortcut) {
              $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
              Check ($link.TargetPath -eq (Join-Path $installDir 'certdoctor-gui.exe')) "it starts the window ($($link.TargetPath))"
            }
          }

          Check (@(Entries).Count -eq 0 -and -not (Test-Path -LiteralPath $installDir)) 'nothing of ours on the runner before'
          Check ((Msi '/i' $first 'install.log') -eq 0) 'installed'
          Check-Installed
          $firstCode = @(Entries)[0].PSChildName

          Check ((Msi '/i' $second 'rebuild.log') -eq 0) 'a rebuild of the same version installed over it'
          Check-Installed
          Check (@(Entries)[0].PSChildName -ne $firstCode) "the rebuild replaced the first build ($firstCode -> $(@(Entries)[0].PSChildName))"

          Set-Content -LiteralPath (Join-Path $installDir 'somebody-elses.txt') -Value 'not ours'
          Check ((Msi '/x' $second 'uninstall.log') -eq 0) 'uninstalled, with a file of somebody else in the folder'
          Check (@(Entries).Count -eq 0) 'no entry in Programs and Features'
          Check (@(Ours-On-Path).Count -eq 0) 'nothing of ours on the machine PATH'
          Check (-not (Test-Path -LiteralPath $shortcut)) 'no shortcut'
          Check (-not (Test-Path -LiteralPath $regKey)) "no registry key $regKey"
          $left = (@(Get-ChildItem -LiteralPath $installDir -Recurse -File | ForEach-Object { $_.Name }) -join ', ')
          Check ($left -eq 'somebody-elses.txt') "the folder holds only the file that is not ours ($left)"

          if ($script:failed -ne 0) { throw "$($script:failed) check(s) of the installer failed" }
          "the installer installs, replaces itself and leaves nothing of its own behind"

      - name: keep what msiexec said, when a check failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  publish:
    name: attest the build and open an empty draft
    needs: [check, build, installer]
    # The only job that writes anything, and the only one fenced behind a tag.
    # Running this workflow by hand stops before here on purpose.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # id-token mints the short lived token that signs the statement, and
      # attestations writes it to this repository's store. Nothing else here
      # needs either.
      id-token: write
      attestations: write
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/incoming

      # build.sha256 rather than verify-SHA256SUMS.txt, and the difference is the
      # point. These are the bytes the RUNNER made. The Windows and macOS
      # archives are signed afterwards, which changes them, so the list a user
      # checks is written on the maintainer's machine over what will be
      # downloaded. This one names exactly what the statement below covers.
      - name: one list of what this build produced
        shell: bash
        working-directory: ${{ runner.temp }}/incoming
        run: |
          set -euo pipefail
          sha256sum -- * > build.sha256
          cat build.sha256

      # WHO built it and FROM WHAT: this repository, this commit, this workflow,
      # a GitHub hosted runner - signed with a short lived identity. A signature
      # says who vouches for a file and provenance says which source and which
      # build produced it, so both are worth having. A stolen key cannot forge
      # this, and a fork cannot claim to be this repository.
      #
      # It stays true for the Linux archives, which nothing signs. For the
      # Windows and macOS ones it describes what the runner made before a person
      # signed it, which is true and is not what anybody downloads - so those
      # get a statement of their own in attest-release.yml.
      - name: attest what this build produced
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/incoming/build.sha256

      # The statement travels with the build to the signing machine, which
      # checks the archives against it before touching them.
      - name: keep the statement with the build
        shell: bash
        run: cp "${{ steps.provenance.outputs.bundle-path }}" "$RUNNER_TEMP/incoming/build.provenance.sigstore.json"

      # No assets. These are not the bytes a user gets, and an unsigned
      # executable on a release page - even for a quarter of an hour - is an
      # executable somebody downloads.
      #
      # A tag whose name carries a hyphen - v0.2.0-rc.1 - is a prerelease.
      - name: open the draft, with nothing in it yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--draft --title "${GITHUB_REF_NAME}" --notes-file .github/release-notes.md)
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          echo "drafted ${GITHUB_REF_NAME}, empty on purpose"

      # The seam between where builds belong and where signatures belong. The
      # name is what the signing script asks for.
      - name: hand the build over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-build-${{ github.ref_name }}
          path: ${{ runner.temp }}/incoming/*
          if-no-files-found: error

      - name: what happens next
        shell: bash
        run: |
          echo "Built, attested, and opened as an EMPTY DRAFT. Nothing is published."
          echo
          echo "On the machine with the card, with the Mac awake, from a clone of this repository:"
          echo
          echo "    python .github/scripts/sign_release.py ${GITHUB_REF_NAME} --macos-host user@mac"
          echo
          echo "It checks this build's provenance before touching it, signs every program and"
          echo "library in the three Windows archives with the card, hands the two macOS"
          echo "archives to the Mac to be signed, notarised and stapled, builds the Windows"
          echo "installer from the signed window archive and signs it, writes"
          echo "verify-SHA256SUMS.txt over what it made, uploads everything to the draft and"
          echo "asks attest-release.yml for the statement about the signed bytes. Then read"
          echo "the draft and publish it."
