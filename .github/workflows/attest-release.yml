# certdoctor release - the second phase, after a person has signed it.
#
# The build workflow cannot sign. The Windows key is on a card that cannot be
# exported and the Apple key is in a keychain on a Mac, so
# .github/scripts/sign_release.py signs on the maintainer's machine and then
# dispatches this. Here the signed files get the statement that travels with
# them, and the release is still a draft when this finishes.
#
# It DOWNLOADS what the release holds rather than trusting the digest it was
# handed, so everything attested here is a statement about bytes this job is
# holding. The digest input is kept as a cross-check: if it disagrees with the
# file on the release, something moved between signing and this run, and it
# stops.
#
# What it does NOT do: build provenance. That belongs to the workflow that built
# something, and it is made there, over the unsigned build. Claiming here that
# this workflow produced files a person signed on their own machine would be
# false in the one document nobody should have to doubt.
name: attest-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, for example v0.1.0"
        required: true
      digest:
        description: "sha256 of verify-SHA256SUMS.txt, as sign_release.py printed it"
        required: true

permissions:
  contents: read

jobs:
  attest:
    name: attest the signed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Reading the draft's assets and attaching the statement to it.
      contents: write
      # id-token mints the short lived token that signs the statement, and
      # attestations writes it to this repository's store.
      id-token: write
      attestations: write
    steps:
      # The checksums first, because they are the list of what to fetch. The
      # names come out of the file being verified, so adding a download to a
      # release cannot leave a second list behind - in the project this came
      # from, a hand written list of patterns missed the provenance bundle and
      # stopped the first real release after the signing was done.
      - name: fetch what the maintainer signed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CLAIMED: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed"
          cd "$RUNNER_TEMP/signed"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'verify-SHA256SUMS.txt'
          actual="$(sha256sum verify-SHA256SUMS.txt | cut -d' ' -f1)"
          echo "the release carries: $actual"
          if [ "$actual" != "$CLAIMED" ]; then
            echo "::error::the checksums file on the release hashes to $actual, but this run"
            echo "::error::was dispatched for $CLAIMED - something changed in between"
            exit 1
          fi
          # Collected before anything is fetched, because gh reads standard
          # input and a download inside the read loop eats the rest of the list.
          names=()
          while read -r _ name; do
            [ -n "${name:-}" ] && names+=("$name")
          done < verify-SHA256SUMS.txt
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::verify-SHA256SUMS.txt names no files, so there is nothing to attest"
            exit 1
          fi
          echo "the checksums describe ${#names[@]} file(s)"
          for name in "${names[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          done
          sha256sum -c verify-SHA256SUMS.txt
          sboms=(*.spdx.json)
          if [ "${#sboms[@]}" -ne 1 ] || [ ! -f "${sboms[0]}" ]; then
            echo "::error::expected one bill of materials among the signed files, found ${#sboms[@]}"
            exit 1
          fi
          echo "SBOM=$RUNNER_TEMP/signed/${sboms[0]}" >> "$GITHUB_ENV"
          echo "SUMS=$RUNNER_TEMP/signed/verify-SHA256SUMS.txt" >> "$GITHUB_ENV"

      # The bill of materials, bound to the files a person actually downloads.
      # The signature changed the bytes of the Windows and macOS archives, and a
      # statement about the wrong bytes verifies against nothing.
      - name: attest what is inside the signed files
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.SUMS }}
          sbom-path: ${{ env.SBOM }}

      # The release notes tell people to pass --predicate-type, because gh asks
      # for build provenance unless told otherwise. That URI is written by hand,
      # so it is checked here against the statement that was actually made - the
      # one moment the real value exists. A wrong URI makes a correct release
      # look broken, and the message a person gets is "no attestation found".
      - name: the release notes promise a command, so check the command works
        shell: bash
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          promised="https://spdx.dev/Document/v2.3"
          actual="$(jq -r '.dsseEnvelope.payload' "$BUNDLE" | base64 -d | jq -r '.predicateType')"
          echo "the statement carries: $actual"
          if [ "$actual" != "$promised" ]; then
            echo "::error::the release notes tell people to pass --predicate-type $promised"
            echo "::error::and the statement that was just made is $actual."
            echo "::error::Fix .github/release-notes.md, because as written the command answers"
            echo "::error::\"no attestation found\" and that reads like a broken release."
            exit 1
          fi

      # As a download, not only in the attestation store, so that
      # "gh attestation verify <file> --bundle <this file>" answers offline - and
      # the people this program is for are the ones whose network gets in the
      # way of the API.
      - name: publish the statement beside the files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          name="$RUNNER_TEMP/verify-certdoctor_${TAG#v}.sbom.sigstore.json"
          cp "$BUNDLE" "$name"
          jq -e . "$name" > /dev/null
          gh release upload "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached $(basename "$name") to $TAG, which is still a draft"
