# The words of the website's own interface, in English.
#
# Every other language has a file with the same keys, and more: what the
# program prints - its switches, exit codes and layers - is shown in English
# from web/data/facts/, as the program prints it, and translated in the other
# languages' files. A key a template asks for and a language does not have
# stops the build (--printI18nWarnings with --panicOnWarning), so no page goes
# out with a hole where a word should be.

