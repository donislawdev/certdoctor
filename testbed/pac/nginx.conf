# The server that hands out the PAC file, and the origin the proxy scenarios are
# aimed at - slice P4c.
#
# ONE SERVER DOES BOTH JOBS ON PURPOSE. via, direct and auth all resolve here, so
# the three scenarios differ in NOTHING except what the PAC file says about them.
# Had they pointed at different servers, a request missing from the proxy log
# could have been explained by the server rather than by the routing rule, and
# the oracle would prove nothing.
#
# PLAIN HTTP, NOT HTTPS, AND THAT IS THE POINT OF THIS BENCH RATHER THAN A GAP IN
# IT. A proxy log entry for a GET carries the whole URL, while a CONNECT carries
# only host and port. The chain and interception benches already ask the TLS
# questions - this one asks who the request went through, and plain HTTP answers
# that in a form a person can read. The CONNECT path is exercised separately
# against partner.test, which does serve TLS.
#
# THE PAC FILES ARE STATIC CONTENT, so editing one takes effect on the next
# request. THIS FILE IS NOT - nginx reads it once, at startup, and it is a bind
# mount. That is OBS64 and OBS75, twice walked into on this bench already, and it
# is why verify-inside.sh checks that the bench is serving the tree in front of
# it before believing anything else.

server {
    listen 80 default_server;
    server_name pac.proxy.test via.proxy.test direct.proxy.test auth.proxy.test;

    # The PAC files. The media type is the one RFC-less convention every browser
    # and every PAC library has agreed on since Netscape, and serving it as
    # text/plain is a common misconfiguration certdoctor should eventually be
    # able to name - so the bench gets it RIGHT here and can be made wrong
    # deliberately later.
    location /pac/ {
        alias /srv/pac/;
        types { }
        default_type application/x-ns-proxy-autoconfig;
        autoindex on;
    }

    # The origin the three scenario names answer from. The body names the host
    # asked for, so a proxy log entry and a response body can be lined up against
    # each other without guessing.
    location / {
        default_type text/plain;
        return 200 "certdoctor testbed: proxy bench origin, you asked for $host\n";
    }
}
