# The bench's forward proxy - slice P4c, feeding P8.
#
# A SNIPPET RATHER THAN A REPLACEMENT FOR squid.conf, and the reason is a
# measurement. The image ships a 353 KB default configuration whose line 1618
# reads "include /etc/squid/conf.d/*.conf" and whose line 1625 reads
# "http_access deny all" - so a snippet dropped in conf.d is read while the
# default rules are still in force, and an allow rule here still lands before the
# final deny. Replacing the whole file would mean owning every one of those
# defaults, including the Safe_ports and CONNECT rules that make this behave like
# a proxy somebody actually runs.
#
# WHY SQUID AT ALL, RATHER THAN A SECOND MITMPROXY. The bench already has
# mitmproxy and it can forward-proxy, so this image is a genuine addition and was
# weighed as one. Two reasons carried it. The claims P8 makes are about PROTOCOL
# behaviour - 407 challenges, CONNECT tunnelling - and checking them against the
# same implementation twice would make one product's quirks into the truth.
# Second, squid tunnels CONNECT without touching TLS, so this bench finally holds
# a proxy that is NOT a middlebox - and "a proxy is not an interception" is a
# distinction the product has to make and had no bench for.
#
# TWO PORTS, ONE PROCESS, AND THEY DIFFER IN ONE THING ONLY. 3128 forwards. 3129
# forwards after a credential. Same squid, same rules, same log - so a difference
# in what a client gets back can only come from the authentication requirement.

# The second listener. 3128 is already declared by the default configuration.
http_port 3129

# The credential check for 3129. THE PASSWORD FILE IS A FIXTURE AND SAYS SO -
# see certdoctor-passwd. Nothing on this bench is reachable from outside the
# compose network, and no scenario needs the credential to SUCCEED: the fact P8
# has to detect is the 407 that comes back when there is no credential at all.
# It is a working credential anyway, so a half-bench does not have to be
# explained later.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/certdoctor-passwd
auth_param basic realm certdoctor testbed proxy
auth_param basic children 1
auth_param basic credentialsttl 5 minutes

acl bench_authport myport 3129
acl bench_authenticated proxy_auth REQUIRED

# ORDER IS THE WHOLE RULE. The deny naming an authentication requirement is what
# makes squid send 407 rather than 403, and it has to be reached before any allow
# that would let the request through unchallenged.
http_access deny bench_authport !bench_authenticated
http_access allow localnet
http_access allow localhost

# THE ACCESS LOG IS THE ORACLE, WHICH IS WHY IT IS DECLARED HERE RATHER THAN LEFT
# TO A DEFAULT. docs/21 section 2b has carried the row "the proxy will actually
# be used - no independent tool, a gap by nature" since it was written. On a real
# machine that is true. On this bench it is not: a request either appears in this
# file or it does not, and that is somebody else's record rather than our own
# code agreeing with itself.
#
# stdio rather than daemon: one fewer helper process between the event and the
# bytes on disk, and this bench has no volume of traffic to protect anybody from.
access_log stdio:/var/log/squid/access.log squid

# 🔴 MEASURED 2026-09-02, AND IT COST A FALSE NEGATIVE BEFORE IT WAS FOUND.
# squid strips everything after "?" from a logged URL by default, so a request
# tagged with a query string arrives in the log as "GET http://host/?" with the
# tag gone. The first run of this bench therefore reported that a request which
# had plainly succeeded through the proxy - HTTP 200, right in front of it - had
# never arrived.
#
# It is turned off because a measuring rig's log has to record what happened. But
# the run token was ALSO moved out of the query string and into the path, because
# a witness that depends on a privacy setting of the thing being watched is a
# witness that can be switched off by somebody tidying a configuration.
strip_query_terms off

# A measuring rig has no business caching. A second identical request must reach
# the origin and appear in the log again, or a scenario run twice would read as a
# scenario that stopped working.
cache deny all
