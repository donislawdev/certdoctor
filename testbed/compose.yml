# The testbed's DNS bench.
#
# WHY A FIXED SUBNET AND A FIXED ADDRESS. certdoctor asks the resolvers a machine
# is CONFIGURED to use - it has no switch for "ask that one over there" - so the
# only honest way to point it at this server is to run it in a container whose
# resolv.conf names this server. That needs an address known before the container
# starts, which a dynamically assigned one is not.
#
# IT ALSO SIDESTEPS A MEASURED TRAP. Docker's own embedded resolver REWRITES
# answers: SERVFAIL comes back as NXDOMAIN and AAAA records disappear (OBS41,
# measured). Those are precisely the three facts this bench exists to produce, so
# queries have to reach this server directly rather than through Docker's.
#
# Nothing here forwards anywhere. A name this bench does not know answers
# NXDOMAIN from its own catch-all rather than travelling to the internet, so the
# bench behaves the same on a train as in CI.
name: certdoctor-testbed

# IMAGES ARE PINNED TO A VERSION, NEVER TO :latest - inviolable rule 23. A moving
# tag is a dependency admitted through the back door: the bench a contributor runs
# and the bench CI runs stop being the same bench, and the day one of them starts
# answering differently there is nothing to compare against. Beside each pin: the
# version, where it was checked, and when.
#
# WHAT A PINNED TAG STILL DOES NOT GIVE US, said rather than glossed over: a tag
# is a name and can be re-pushed to point at different bytes. Only a digest is
# immutable. Tags are used here because this bench is a measuring rig rather than
# something shipped, and a file full of digests is a file nobody updates - but
# "pinned" here means "one declared version", not "byte-identical for ever".
services:
  dns:
    # CoreDNS 1.14.6, the current stable release - checked at
    # https://github.com/coredns/coredns/releases on 2026-08-17, and confirmed by
    # running the image: it reports CoreDNS-1.14.6.
    image: coredns/coredns:1.14.6
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./dns:/etc/coredns:ro
    networks:
      testbed:
        ipv4_address: 172.28.0.53
    healthcheck:
      # The bench is useless until it answers, and a verification run that starts
      # a millisecond too early reads as a broken product rather than as a race.
      test: ["CMD", "/coredns", "-version"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Mints root -> intermediate -> leaf and exits. AN INIT CONTAINER RATHER THAN A
  # RUNNING CA, decided 2026-08-17: nothing in M1 asks a CA for anything, and a
  # service with no consumer is the shape this project has just decided to stop
  # building. When something wants certificates on demand, this becomes step-ca
  # proper and the change is visible in one place.
  chain:
    # step-ca 0.30.2, the current stable release - checked at
    # https://github.com/smallstep/certificates/releases on 2026-08-17, and
    # confirmed by running the image: Smallstep CA/0.30.2. The image carries the
    # step CLI, which is all this service uses.
    image: smallstep/step-ca:0.30.2
    entrypoint: ["/bin/sh", "/generate.sh"]
    user: root
    volumes:
      - ./chain/generate.sh:/generate.sh:ro
      - certs:/out
    networks:
      - testbed
    restart: "no"

  # The server that does not send its intermediate - scenario S-5.
  partner:
    # nginx 1.30.4, the STABLE branch. nginx.org lists 1.31.3 as mainline and
    # 1.30.4 as stable - checked on 2026-08-17 - and the image confirms
    # nginx/1.30.4. A measuring rig takes the boring branch: the point here is
    # the certificate it serves, never the server.
    image: nginx:1.30.4-alpine
    depends_on:
      chain:
        condition: service_completed_successfully
    volumes:
      - ./partner/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    networks:
      testbed:
        ipv4_address: 172.28.0.80
    healthcheck:
      # Asks only whether the socket is up. Whether the chain it presents is
      # incomplete is the question the bench EXISTS to answer, so it must never
      # be something a health check quietly repairs or hides.
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 3s
      retries: 5

  # Traffic re-signed by a CA local to this machine - scenario S-1.
  #
  # ITS ROOT IS GENERATED AT STARTUP AND IMPORTED INTO NO REAL MACHINE. Putting
  # it into a trust store on the host would be a change "docker compose down"
  # does not undo. The verification container is a different matter entirely: it
  # is thrown away at the end of the run, so the import that makes S-1 a matrix
  # rather than a single row happens there - verify-inside.sh, which reads the
  # root out of the volume below.
  #
  # AN EARLIER VERSION OF THIS COMMENT SAID THE IMPORT LANDS "with P6, where L4
  # can measure it" AND THAT WAS FALSE. ADR46 forbids L4 touching any trust
  # store, so the question belongs to L5 - measured and corrected in D14.
  mitm:
    # mitmproxy 12.2.3, the current release - checked at
    # https://github.com/mitmproxy/mitmproxy/releases on 2026-08-17, and
    # confirmed by running the image: Mitmproxy 12.2.3.
    image: mitmproxy/mitmproxy:12.2.3
    # TWO LISTENERS IN ONE PROCESS, AND THE SECOND ONE IS WHAT LETS P6b HAPPEN
    # BEFORE P8 - measured 2026-08-19, both modes served by one mitmdump.
    #
    # regular@8080 is the forward proxy. Nothing in certdoctor can be pointed
    # through it yet, because dialling through a proxy is L2 and that is slice
    # P8. It stays because openssl reaches it today with -proxy and because P8
    # will need it unchanged.
    #
    # reverse@443 is the same middlebox reached WITHOUT any proxy support: it
    # terminates TLS, mints a certificate for whatever name the client asked
    # for, and forwards to the origin. To a client it is indistinguishable from
    # the server it stands in front of, which is the whole point - measured, a
    # client asking for registry.example.net gets CN=registry.example.net signed
    # by CN=mitmproxy.
    command: >
      mitmdump --mode regular@8080
      --mode reverse:https://partner.test:443@443
      --set confdir=/home/mitmproxy/.mitmproxy
      --set termlog_verbosity=warn --flow-detail 0
    depends_on:
      partner:
        condition: service_healthy
    # It has to resolve partner.test the way this bench does, or it would ask
    # Docker's resolver and get NXDOMAIN for a name only this bench knows.
    dns:
      - 172.28.0.53
    networks:
      testbed:
        ipv4_address: 172.28.0.81
    volumes:
      # THE ROOT HAS TO BE READABLE FROM OUTSIDE THIS CONTAINER, or S-1 stops at
      # a single red row. mitmproxy mints this CA at startup and it exists
      # nowhere else, so the verification container mounts this volume read only
      # and imports the root into ONE of its two stores - which is what makes
      # the matrix show some runtimes accepting the traffic and others not.
      - mitmconf:/home/mitmproxy/.mitmproxy

  # The server that hands out the PAC file, and the origin the proxy scenarios
  # are aimed at - slice P4c, feeding P8.
  #
  # THE SAME NGINX IMAGE THE partner SERVICE ALREADY PINS. A second copy of a
  # version somebody has to keep in step is a second place to get it wrong, and
  # this service asks nothing of nginx that the other one does not.
  #
  # IT IS BOTH THE SOURCE OF THE RULE AND THE SUBJECT OF IT. via, direct and auth
  # all resolve here, so the only thing that differs between those three
  # scenarios is what the PAC file says - and the PAC file comes from this same
  # server. One address, one variable.
  pac:
    image: nginx:1.30.4-alpine
    volumes:
      - ./pac/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pac/files:/srv/pac:ro
    networks:
      testbed:
        ipv4_address: 172.28.0.90
    healthcheck:
      # It asks for the PAC file itself rather than for the port, because a
      # server answering on 80 while the alias is wrong is exactly the failure
      # this bench would otherwise report as a product defect.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/pac/proxy.pac"]
      interval: 2s
      timeout: 3s
      retries: 5

  # The forward proxy - slice P4c, and the reason this slice can be an oracle at
  # all.
  #
  # squid 7.2, from Canonical's image, tag last updated 2026-09-01 - read at
  # https://hub.docker.com/v2/repositories/ubuntu/squid/tags on 2026-09-02.
  # Upstream's current stable SERIES is 7 and its newest point release is 7.7,
  # dated 2026-08-24 - read at https://www.squid-cache.org/Versions/ on
  # 2026-09-02. SO THIS PIN IS THE RIGHT SERIES AND AN OLDER POINT RELEASE, said
  # outright rather than rounded up to "current". Squid is licensed GPL, which is
  # the same family as this project and raises no question under docs/09 section
  # 10 - and it is a bench tool in any case, never shipped to a user.
  #
  # THE IMAGE IS ROOTLESS AND RUNS UNDER PEBBLE rather than a plain entrypoint -
  # measured 2026-09-02, UID 584792. That matters for one thing only, and it is
  # handled below: /var/log/squid is owned by that user IN THE IMAGE, so a named
  # volume mounted there inherits the ownership and squid can write its log.
  #
  # WHY A SECOND PROXY WHEN mitmproxy IS ALREADY HERE: see proxy/certdoctor.conf.
  # Short version - the claims are about protocol behaviour, and checking them
  # against one implementation twice would make that implementation the truth.
  proxy:
    image: ubuntu/squid:7.2-26.04_edge
    volumes:
      - ./proxy/certdoctor.conf:/etc/squid/conf.d/certdoctor.conf:ro
      - ./proxy/certdoctor-passwd:/etc/squid/certdoctor-passwd:ro
      # THE ORACLE ITSELF. Everything this proxy is asked to do lands in here,
      # and the verification container mounts it read only. It is somebody else's
      # record of what happened, which is the one thing our own code cannot be.
      - proxylog:/var/log/squid
    # It has to resolve the bench's names the way the bench does, or it would ask
    # Docker's resolver and get NXDOMAIN for names only this bench knows - the
    # same reason the mitm service names this resolver.
    dns:
      - 172.28.0.53
    depends_on:
      pac:
        condition: service_healthy
    networks:
      testbed:
        ipv4_address: 172.28.0.128

volumes:
  # The chain lives here and never in the working tree. ADR5 says a private key
  # is never committed; a volume makes that true by construction rather than by a
  # .gitignore pattern that somebody could widen later.
  certs:

  # The proxy's access log. It is a VOLUME rather than a bind mount so that a
  # bench run cannot leave a log file lying in the working tree - inviolable rule
  # 14 is about the product, but a measuring rig that litters teaches the habit
  # the rule exists to prevent.
  proxylog:

  # The middlebox's own CA, minted at its startup. Same rule as certs above and
  # for the same reason: a private key belongs in a volume, never in the tree.
  mitmconf:

networks:
  testbed:
    ipam:
      config:
        - subnet: 172.28.0.0/16
