# The partner that does not send its intermediate - scenario S-5.
#
# THE WHOLE SCENARIO IS ONE LINE, AND IT IS ssl_certificate BELOW. It points at
# leaf.crt rather than at bundle.crt, which the generator writes alongside it. So
# this server presents ONE certificate. A client that trusts the root still
# cannot build a path to it, because the certificate joining the two is the one
# that was never sent.
#
# THIS IS THE MOST COMMON REAL MISCONFIGURATION THIS TOOL WILL EVER MEET, and it
# is invisible from a browser that has cached the intermediate from some other
# site - which is exactly why "works for me" is such a common reply to it.

server {
    listen 443 ssl;
    server_name partner.test;

    # ONE FILE, NOT THE BUNDLE. Swapping this for bundle.crt turns the scenario
    # into an ordinary working site, which is the difference the bench exists to
    # show.
    ssl_certificate     /certs/leaf.crt;
    ssl_certificate_key /certs/leaf.key;

    # Nothing here is about ciphers or versions. Those are L4's questions and
    # they get their own bench when there is something to ask them.
    location / {
        default_type text/plain;
        return 200 "certdoctor testbed: partner.test, serving a leaf with no intermediate\n";
    }
}
