# staticcheck, MIT, run in CI at a pinned version and never imported, so it is
# not a module of this project.
#
# "inherit" is staticcheck's own default set. Until 2026-11-23 CI ran it as
# -checks=SA,U, which names no check at all - a check list takes SA* for a
# family, and a bare SA matches nothing - so the job passed without running
# anything. Measured that day on the same tree with 2026.2.2: no finding with
# SA,U and 31 with the default set, every one of them read and fixed or, for
# three error strings a test copies from the system, left with a lint:ignore
# and the reason at the line.
#
# Nothing is switched off here. A check that reports correct code gets its
# reason at the line rather than a hole in this list, so it keeps watching
# every line nobody has read yet.
checks = ["inherit"]
